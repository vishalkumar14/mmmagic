# Linux matrix for the internal GitLab mirror.
#
# The GitHub Actions workflow (.github/workflows/ci.yml) additionally covers
# macOS and Windows; GitLab shared runners here are Linux only.
stages:
  - test

.node_template: &node_template
  stage: test
  image: node:${NODE_VERSION}-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3 make g++
    - export npm_config_python=/usr/bin/python3
    - node --version && npm --version && g++ --version | head -1
  script:
    # --foreground-scripts keeps every compiler warning in the job log.
    - npm install --foreground-scripts
    - npm test
  # A native build has nothing useful to cache between versions.
  cache: {}

node22:
  <<: *node_template
  variables:
    NODE_VERSION: "22"

node24:
  <<: *node_template
  variables:
    NODE_VERSION: "24"

node26:
  <<: *node_template
  variables:
    NODE_VERSION: "26"
